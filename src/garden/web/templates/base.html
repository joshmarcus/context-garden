<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}garden{% endblock %} · {{ garden_name }}</title>
<style>
:root { --bg:#f6f7f4; --panel:#fff; --ink:#1f2421; --muted:#6b736e; --line:#e2e6e0; --accent:#2f6f4f;
  --waiting_human:#b0306f; --draft:#9aa39d; --blocked:#c9a300; --ready:#0c7c8a; --running:#2b5fb3; --in_review:#6b46c1; --changes_requested:#c25e00; --done:#2f8a4f; --failed:#c0392b; --cancelled:#aaa; }
@media (prefers-color-scheme: dark) { :root { --bg:#151815; --panel:#1e221f; --ink:#e7ebe6; --muted:#9aa39d; --line:#2c332e; } }
* { box-sizing: border-box; }
body { margin:0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--ink); }
a { color: inherit; }
header { display:flex; gap:18px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:2; }
header .brand { font-weight:700; color:var(--accent); text-decoration:none; }
header nav a { margin-right:14px; text-decoration:none; color:var(--muted); }
header nav a:hover { color: var(--ink); }
header .right { margin-left:auto; display:flex; gap:10px; align-items:center; color:var(--muted); font-size:12px; }
main { padding:16px 18px; }
button, .btn { font: inherit; padding:5px 11px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); cursor:pointer; text-decoration:none; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.danger { color: var(--failed); }
form.inline { display:inline; }
.board { display:grid; grid-template-columns: repeat(9, minmax(140px, 1fr)); gap:10px; overflow-x:auto; }
.tl { list-style:none; padding:0; margin:0; font-size:12px; }
.tl li { padding:3px 0; border-bottom:1px dashed var(--line); }
.tl .k { display:inline-block; min-width:110px; font-weight:600; }
textarea { font:inherit; width:100%; min-height:70px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
.badge { display:inline-block; font-size:10px; padding:0 5px; border-radius:4px; border:1px solid var(--line); color:var(--muted); margin-left:4px; }
.col { background:var(--panel); border:1px solid var(--line); border-radius:8px; min-height:120px; padding:8px; }
.col h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; display:flex; justify-content:space-between; }
.col h3 .n { color:var(--muted); font-weight:400; }
.card { display:block; text-decoration:none; border:1px solid var(--line); border-left:4px solid var(--c, var(--muted)); border-radius:6px; padding:7px 9px; margin-bottom:8px; background:var(--bg); }
.card:hover { border-color: var(--accent); }
.card .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; color:var(--muted); }
.card .t { display:block; margin-top:2px; }
.card .meta { color:var(--muted); font-size:11px; margin-top:4px; }
.pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; color:#fff; background:var(--c, var(--muted)); vertical-align:middle; }
.s-waiting_human{--c:#b0306f} .s-draft{--c:var(--draft)} .s-blocked{--c:var(--blocked)} .s-ready{--c:var(--ready)} .s-running{--c:var(--running)} .s-in_review{--c:var(--in_review)} .s-changes_requested{--c:var(--changes_requested)} .s-done{--c:var(--done)} .s-failed{--c:var(--failed)} .s-cancelled{--c:var(--cancelled)}
table { border-collapse: collapse; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
th, td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
.muted { color:var(--muted); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:14px; }
.grid2 { display:grid; grid-template-columns: 2fr 1fr; gap:14px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } .board { grid-template-columns: repeat(4, minmax(150px,1fr)); } }
.prose h1,.prose h2,.prose h3 { margin-top:1em; }
.prose pre { background:var(--bg); padding:10px; border-radius:6px; overflow-x:auto; }
.prose code { font-size:12.5px; }
.actions { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.log { font-family: ui-monospace, Menlo, monospace; font-size:12px; white-space:pre-wrap; color:var(--muted); }
.warn { background:#fff3cd; color:#5c4600; border:1px solid #e6d28a; padding:8px 12px; border-radius:6px; margin-bottom:12px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
.filters a { padding:3px 9px; border:1px solid var(--line); border-radius:999px; text-decoration:none; font-size:12px; color:var(--muted); }
.filters a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.kv { display:grid; grid-template-columns: 130px 1fr; gap:4px 10px; font-size:13px; }
.kv dt { color:var(--muted); } .kv dd { margin:0; }
details summary { cursor:pointer; color:var(--muted); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">🌱 {{ garden_name }}</a>
  <nav>
    <a href="/">Board</a>
    <a href="/graph">Graph</a>
    <a href="/runs">Runs</a>
    <a href="/events">Timeline</a>
    {% for p in products %}{% for ph in p.phases %}<a href="/phases/{{ p.name }}/{{ ph.name }}" title="{{ p.name }}/{{ ph.name }}">{{ ph.name }}</a>{% endfor %}{% endfor %}
  </nav>
  <div class="right">
    <span>{% if watch %}scheduler loop on{% else %}scheduler loop off{% endif %}{% if last_tick %} · last tick {{ last_tick[11:19] }}Z{% endif %}</span>
    <form method="post" action="/tick"><button class="primary" title="Reap finished workers, poll PRs, dispatch ready tasks">Tick now</button></form>
  </div>
</header>
<main>{% block body %}{% endblock %}</main>
<script>
// tiny poller: any element with data-poll="/url" data-every="5000" refreshes its innerHTML.
document.querySelectorAll("[data-poll]").forEach(el => {
  const every = parseInt(el.dataset.every || "5000", 10);
  setInterval(async () => {
    if (document.hidden) return;
    try { const r = await fetch(el.dataset.poll, {cache: "no-store"}); if (r.ok) el.innerHTML = await r.text(); } catch (e) {}
  }, every);
});
</script>
</body>
</html>
