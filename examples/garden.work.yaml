# Environment overlay, loaded on top of garden.yaml when GARDEN_ENV=work.
# Copy to the garden root as garden.work.yaml and adjust. Keys merge; lists replace.
#
#   GARDEN_ENV=work garden serve
#
# A per-machine overlay, garden.local.yaml, is applied last and is gitignored.

runner: ssh                       # workers on the build hosts, not this laptop
ssh:
  hosts:
    - name: build-1
      host: me@build-1.internal
      repos: {context-garden: /srv/gardens/context-garden}
      max_parallel: 4
    - name: build-2
      host: me@build-2.internal
      repos: {context-garden: /srv/gardens/context-garden}
      max_parallel: 4

github:
  use_gh: true
  draft_pr: true

checks:
  ci:                             # replaces the home list entirely (lists do not merge)
    - name: jenkins-log
      python: "garden.checks:local_command_check"
      command: "scripts/jenkins_failures.sh"   # prints the failing job log; exit 1 on failure
      flaky_patterns: ["ETIMEDOUT", "ECONNRESET", "Slave went offline"]
      # Run instead of a revise round when the log looks flaky. It comes only from here (never
      # from a check's own output) and runs scrubbed — no GitHub token or the operator's HOME
      # unless worker_env.pass names them below. If the rebuild needs a token, add it there.
      retry_command: "scripts/jenkins_rebuild.sh"

# Extra environment names/globs a worker, its setup command and the checks keep, on top of
# the built-in allowlist. HOME is dropped by default (a worker runs under an isolated scratch
# home); list it here to restore the operator's home for a tool that needs it.
worker_env:
  pass: []                          # e.g. ["JENKINS_TOKEN"] if retry_command needs it, or ["HOME"]

harnesses:
  claude:
    models: {easy: haiku, medium: sonnet, hard: sonnet}   # cheaper tier map for work

# Runs whenever a task needs you: awaiting_triage (after its review verdict is in),
# waiting_human, failed, a changes_requested past max_revisions, or a stall/budget event.
# Gets GARDEN_TASK_ID, GARDEN_STATUS, GARDEN_MESSAGE, GARDEN_PR as environment variables.
# `garden doctor` runs this for real with a synthetic payload, so a typo or a dead webhook
# shows up there instead of the first time a task actually needs you.
notify:
  # GARDEN_MESSAGE is worker-written text, so it can hold a quote, a backslash or a
  # newline: build the JSON with `jq -n --arg` (quotes each value) rather than splicing
  # the variables into a hand-written "{\"text\": \"...\"}" string, which a stray quote
  # in the message would break (or use to inject extra JSON).
  command: >-
    curl -sS -X POST -H 'Content-type: application/json'
    --data "$(jq -n --arg status "$GARDEN_STATUS" --arg task "$GARDEN_TASK_ID"
    --arg message "$GARDEN_MESSAGE" --arg pr "$GARDEN_PR"
    '{text: "[\($status)] \($task): \($message) \($pr)"}')"
    "$SLACK_WEBHOOK_URL"
  timeout_seconds: 15

# How each product prepares its working environment. The runner runs `setup.command` once in
# a fresh worktree (again only when the command changes), with `setup.env` added; `test`/`lint`
# name the commands the brief gives the worker and the commands `checks.pre_pr` runs by default.
# Nothing here assumes Python, pip, uv or a venv — a product sets whatever its stack needs.
products:
  webapp:                           # a Node product: npm for deps, make for the checks
    repo: git@github.com:me/webapp.git
    base_branch: main
    id_prefix: WEB
    setup:
      command: "npm ci"             # runs in the fresh worktree before the worker
      test: "make test"
      lint: "make lint"
      timeout_seconds: 900

  ledger:                           # dependencies come from a company tool, not a public index
    repo: git@github.com:me/ledger.git
    base_branch: main
    id_prefix: LGR
    setup:
      command: "acme-env install --frozen"   # your org's bootstrap; populates a company toolchain
      env:
        ACME_PROFILE: ci            # extra environment for setup, the worker and the checks
        ACME_CACHE: /srv/acme/cache
      test: "acme-env run -- ctest"
      lint: "acme-env run -- clang-tidy src"
