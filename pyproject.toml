[project]
name = "context-garden"
version = "0.3.1"
description = "Drive agent development from a repository of context files: principles, products, phases, tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josh Marcus" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "markdown>=3.5",
    "textual>=0.60",
    "python-multipart>=0.0.9",
]

[project.scripts]
garden = "garden.cli:app"

[project.urls]
Homepage = "https://github.com/joshmarcus/context-garden"
Documentation = "https://github.com/joshmarcus/context-garden/tree/main/docs"
Issues = "https://github.com/joshmarcus/context-garden/issues"
Source = "https://github.com/joshmarcus/context-garden"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout==2.4.0", "ruff>=0.4"]
aws = ["boto3>=1.34"]
plates = ["pillow>=10"]
walkthrough = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garden"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/garden",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
timeout_method = "signal"
session_timeout = 900
markers = [
    "stress: explicit opt-in load, scale, resource-pressure, or latency experiments",
    "browser: explicit opt-in test that launches a browser",
    "needs_remote_clone: test executes an SSH worker against the remote-host checkout",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP042"]
