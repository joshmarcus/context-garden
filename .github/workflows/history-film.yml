name: history-film
on:
  push:
    branches: ["codex/**"]
    paths: ["scripts/history-film/**", "tests/test_history_film.py", ".github/workflows/history-film.yml"]
  pull_request:
    paths: ["scripts/history-film/**", "tests/test_history_film.py", ".github/workflows/history-film.yml"]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/history-film/
            tests/test_history_film.py
          sparse-checkout-cone-mode: false
      # Git for Windows rejects aux.py even in a sparse index. Export just
      # this utility from the exact checked-out source for all three jobs.
      - uses: actions/upload-artifact@v4
        with:
          name: history-film-source
          path: |
            scripts/history-film/
            tests/test_history_film.py
          include-hidden-files: true
          retention-days: 1
  reproduce:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: history-film-source
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML pytest
      - run: python -m pytest --noconftest -c scripts/history-film/pytest.ini tests/test_history_film.py -q
      - run: npm ci --ignore-scripts
        working-directory: scripts/history-film
      - run: npm test
        working-directory: scripts/history-film
      - run: node render.cjs stills --scale 0.25 --frames 4,49.5,58.5
        working-directory: scripts/history-film
