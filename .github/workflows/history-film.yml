name: history-film
on:
  push:
    branches: ["codex/**"]
    paths: ["scripts/history-film/**", "tests/test_history_film.py", ".github/workflows/history-film.yml"]
  pull_request:
    paths: ["scripts/history-film/**", "tests/test_history_film.py", ".github/workflows/history-film.yml"]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The runtime contains aux.py, a reserved Windows filename. This
          # standalone utility only needs its own directory and capture tests.
          sparse-checkout: |
            scripts/history-film/
            tests/test_history_film.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML pytest
      - run: python -m pytest --noconftest -c scripts/history-film/pytest.ini tests/test_history_film.py -q
      - run: npm ci --ignore-scripts
        working-directory: scripts/history-film
      - run: npm test
        working-directory: scripts/history-film
      - run: node render.cjs stills --scale 0.25 --frames 4,49.5,58.5
        working-directory: scripts/history-film
