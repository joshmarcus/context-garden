# CI for the context-garden repository itself. The garden tool does not depend on GitHub
# Actions; at work, an environment overlay (garden.work.yaml) points the CI analyser elsewhere.
name: ci
permissions:
  actions: read
  contents: read
on:
  push:
    branches: [main, "garden/**", "codex/**"]
  pull_request:
jobs:
  quality:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.event.pull_request.head.ref, 'garden/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - name: Verify ordinary shard inventory
        run: python scripts/pytest_shards.py verify --count 3

  test-shard:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.event.pull_request.head.ref, 'garden/')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run ordinary tests (shard ${{ matrix.shard }}/3)
        shell: bash
        run: |
          mapfile -t files < <(python scripts/pytest_shards.py files --count 3 --index "${{ matrix.shard }}")
          (( ${#files[@]} > 0 ))
          pytest -q --durations=40 --timeout=120 --timeout-method=thread "${files[@]}"

  exact-head-push:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'garden/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Assigned garden branches are pushed before their PR is opened. Reuse
      # that exact-head push result. Forks and other events run the shards.
      - name: Verify exact-head push CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$CI_HEAD_SHA" --branch "$CI_HEAD_BRANCH" --event push --limit 20 \
              --json databaseId,headSha,headBranch,event,status,conclusion)"
            run="$(jq -c --arg sha "$CI_HEAD_SHA" --arg branch "$CI_HEAD_BRANCH" \
              '[.[] | select(.headSha == $sha and .headBranch == $branch and .event == "push")] | max_by(.databaseId) // empty' \
              <<<"$runs")"
            if [[ -n "$run" ]]; then
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || {
                  echo "Exact-head push CI did not pass: $conclusion" >&2
                  exit 1
                }
                echo "Exact-head push CI passed: $(jq -r '.databaseId' <<<"$run")"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Exact-head push CI did not register or finish before the gate timed out" >&2
          exit 1

  test:
    if: always()
    needs: [quality, test-shard, exact-head-push]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable result
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARD_RESULT: ${{ needs.test-shard.result }}
          PUSH_RESULT: ${{ needs.exact-head-push.result }}
        run: |
          if [[ "$PUSH_RESULT" == success ]]; then
            [[ "$QUALITY_RESULT" == skipped && "$SHARD_RESULT" == skipped ]]
          else
            [[ "$PUSH_RESULT" == skipped && "$QUALITY_RESULT" == success && "$SHARD_RESULT" == success ]]
          fi
