# CI for the context-garden repository itself. The garden tool does not depend on GitHub
# Actions; at work, an environment overlay (garden.work.yaml) points the CI analyser elsewhere.
name: ci
on:
  push:
    branches: [main, "garden/**", "codex/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Ignore runner Chrome apt source for Playwright system dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - run: python -m playwright install --with-deps chromium
      - run: ruff check src tests scripts
      - run: pytest -q --durations=40 --timeout=120 --timeout-method=thread
