# Runs the scripted QA agent (CG-135) on a schedule and on demand, so a page regression
# in the web UI is caught between phases without spending tokens.
name: qa
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: garden qa --scripted
