name: publish-pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the release tag and package version to agree
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"release tag {os.environ['RELEASE_TAG']!r} != {expected!r}")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify clean installs from wheel and source distribution
        run: |
          version="${GITHUB_REF_NAME#v}"
          for artifact in dist/*; do
            python scripts/verify_distribution.py "$artifact" --version "$version"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/context-garden/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Check whether this exact distribution is already published
        id: existing
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          url = f"https://pypi.org/pypi/context-garden/{version}/json"
          try:
              with urllib.request.urlopen(url) as response:
                  published = json.load(response)["urls"]
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write("matches=false\n")
                  raise SystemExit
              raise

          expected = {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in pathlib.Path("dist").iterdir()}
          actual = {item["filename"]: item["digests"]["sha256"] for item in published}
          if actual != expected:
              raise SystemExit(f"PyPI {version} exists with different artifacts")
          print(f"PyPI {version} already has these exact artifacts; nothing to replace")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matches=true\n")
          PY
      - name: Publish to PyPI with Trusted Publishing
        if: steps.existing.outputs.matches != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
